[tools]
# generic
neovim = "0.12.4"
fd = "10.4.2"
tree-sitter = "0.26.11"
usage = "4.0.0"
lazygit = "0.63.1"
lazydocker = "0.25.2"
fzf = "0.74.1"
task = "3.52.0"
just = "1.57.0"
jq = "1.8.2"
yq = "4.53.3"
bat = "0.26.1"
fx = "39.2.0"
# lua
lua-language-server = "3.18.2"
stylua = "2.5.2"
# toml
tombi = "1.2.4"
# go
go = "1.26.5"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:gotest.tools/gotestsum" = "1.13.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.0"
# js/ts
node = "26.5.0"
bun = "1.3.14"
"npm:@vtsls/language-server" = "0.3.0"
"aqua:biomejs/biome" = "2.5.6"
# json/css/html
"npm:vscode-langservers-extracted" = "4.10.0"
# yaml
"npm:yaml-language-server" = "1.24.0"
"go:github.com/google/yamlfmt/cmd/yamlfmt" = "0.21.0"
# python
"pipx:ipython" = "9.15.0"
uv = "0.11.33"
ruff = "0.16.0"
"pipx:basedpyright" = "1.39.9"
# protobuf
buf = "1.72.0"
# zig
zig = "0.16.0"
zls = "0.16.0"
# rust
rust = { version = "1.97.1", components = ["rust-analyzer", "clippy"] }
# generic things that require something from above
"npm:hunkdiff" = "0.17.6"
