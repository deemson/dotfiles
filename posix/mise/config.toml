[tools]
# generic
neovim = "0.12.6"
fd = "10.5.2"
tree-sitter = "0.27.2"
usage = "7.3.0"
lazygit = "0.66.3"
lazydocker = "0.25.2"
fzf = "0.75.0"
task = "3.54.0"
just = "1.59.0"
jq = "1.8.2"
yq = "4.54.2"
bat = "0.26.1"
fx = "40.0.1"
# lua
lua-language-server = "3.19.2"
stylua = "2.6.0"
# toml
tombi = "1.10.0"
# go
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:gotest.tools/gotestsum" = "1.13.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
# js/ts
node = "26.13.0"
bun = "1.4.4"
"npm:@vtsls/language-server" = "0.3.0"
"aqua:biomejs/biome" = "2.6.6"
# json/css/html
"npm:vscode-langservers-extracted" = "4.10.0"
# yaml
"npm:yaml-language-server" = "2.0.0"
"go:github.com/google/yamlfmt/cmd/yamlfmt" = "0.21.0"
# python
"pipx:ipython" = "9.18.1"
uv = "0.13.7"
ruff = "0.17.4"
"pipx:basedpyright" = "1.40.2"
# protobuf
buf = "1.75.0"
# zig
zig = "0.17.1"
zls = "0.17.0"
# rust
rust = { version = "1.99.1", components = ["rust-analyzer", "clippy"] }
# generic things that require something from above
"npm:hunkdiff" = "0.24.1"
